[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clisweave"
version = "0.1.2"
description = "Unified CLI wrapper + cross-tool session manager for Claude Code, Codex CLI, and Kimi CLI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Hunt Lin", email = "uhuntu@gmail.com" }]
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX",
    "Environment :: Console",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/uhuntu/clisweave"
Repository = "https://github.com/uhuntu/clisweave"

[project.scripts]
ai = "clisweave.cli:main"
cw = "clisweave.cli:main"
aim = "clisweave.cli:main"
clisweave = "clisweave.cli:main"
aimux = "clisweave.cli:main"
ai-sessions = "clisweave.sessions:main"

[tool.setuptools.packages.find]
where = ["src"]
