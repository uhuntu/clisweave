name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Rules selected / ignored live in pyproject.toml under [tool.ruff.lint].
      # Keep this command in sync with that block.
      - run: ruff check src/ tests/
